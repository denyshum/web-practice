<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web3 Design Studio</title>
    <link rel="icon" type="image/svg+xml" href="assets/images/logo.svg">
    <link rel="stylesheet" href="assets/css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="main-header__inner d-flex content-wrap">
            <img src="assets/images/logo.svg" alt="Web3 Design Studio logo">
            <nav class="nav">
                <ul class="nav__list d-flex">
                    <li class="nav__item"><a href="#" class="nav__link">Home</a></li>
                    <li class="nav__item"><a href="#" class="nav__link">About</a></li>
                    <li class="nav__item"><a href="#" class="nav__link">Contact</a></li>
                    <li class="nav__item">
                        <a href="#" class="nav__link">
                            Career
                            <span class="badge d-flex item-center">2</span>
                        </a>
                    </li>
                </ul>
            </nav>
            <button class="menu-btn d-flex">
                <span class="menu-btn__text">Menu</span>
                <img src="assets/images/icons/burger-menu.svg" alt="">
            </button>
        </div>
    </header>
    <main>
        <section class="hero">
            <div class="hero__inner d-flex content-wrap">
                <div class="hero__content d-flex">
                    <h1 class="hero__title">
                        <span class="hero__line hero__line--small-indent">Design studio</span>
                        <span class="hero__line hero__line--large-indent">for the</span>
                        <span class="hero__line hero__line--medium-indent">web3 world</span>
                    </h1>
                    <div class="hero__scroll-block d-flex">
                        <a href="#" class="hero__scroll-link"></a>
                        <p class="hero__desc">
                            We help companies design their products to be ready for web3 world
                        </p>
                    </div>
                </div>
                <div class="hero__image-bg"></div>
            </div>
        </section>
    </main>
    <script src="assets/js/script.js"></script>
</body>
</html>
